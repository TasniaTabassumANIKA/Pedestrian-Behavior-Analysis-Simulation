name: Reproducibility check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  run-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pedestrian behavior simulation
        env:
          MPLBACKEND: Agg
        run: python pedestrian_behavior_simulation_corrected.py

      - name: Verify expected outputs
        run: python verify_outputs.py

      - name: Upload generated outputs
        uses: actions/upload-artifact@v4
        with:
          name: pedestrian-behavior-simulation-outputs
          path: pedestrian_behavior_simulation_outputs/
          if-no-files-found: error
